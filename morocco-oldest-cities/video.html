<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أقدم المدن المغربية</title>
<style>
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo900.ttf)}
@font-face{font-family:Tajawal;font-weight:900;src:url(fonts/tajawal900.ttf)}
@font-face{font-family:Tajawal;font-weight:800;src:url(fonts/tajawal800.ttf)}
:root{--purple:#3a1a6e;--purple2:#5b3a9a;--orange:#ee7a1d;--paper:#ecebe7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);font-family:Cairo,Tajawal,sans-serif}
#paper{position:absolute;inset:-40px;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='600' height='600' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,255,255,.0) 55%,rgba(60,40,90,.06) 100%);pointer-events:none}
.abs{position:absolute}
.scene{position:absolute;inset:0;display:none}
.mm{mix-blend-mode:multiply}
.gray{filter:grayscale(1) contrast(1.15)}
.shadow{filter:drop-shadow(0 14px 18px rgba(30,10,60,.28))}
.circle{border-radius:50%;background:var(--purple)}
.label{width:520px;height:132px;background:#fbfbf8;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#9db7e6 31px 33px);
  box-shadow:0 10px 18px rgba(0,0,0,.25);border-radius:4px}
.label:before{content:"";position:absolute;right:56px;top:0;bottom:0;width:3px;background:#e8837c}
.label .spiral{position:absolute;left:12px;top:14px;width:16px;height:104px;
  background:radial-gradient(circle at 8px 8px,#333 0 6px,transparent 7px) 0 0/16px 26px repeat-y}
.label span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:88px;color:var(--purple);
  text-shadow:3px 3px 0 #f2a65c,-3px -3px 0 #6fa8dc;padding-right:30px}
.num{font-family:Tajawal;font-weight:900;font-size:230px;line-height:1;color:var(--purple);direction:ltr;white-space:nowrap;letter-spacing:-2px}
.unit{font-weight:800;font-size:76px;color:var(--purple);letter-spacing:6px}
.note{font-weight:800;font-size:56px;color:var(--orange)}
.brushbg{background:#fff;border-radius:46% 54% 50% 50%/60% 46% 54% 40%;filter:blur(1px);box-shadow:0 0 30px 14px #fff}
#wipe{position:absolute;inset:0;pointer-events:none;display:none}
#wipe div{position:absolute;top:-200px;height:1500px;transform:skewX(-14deg)}
#dots{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;gap:16px;direction:ltr}
#dots i{width:18px;height:18px;border-radius:50%;background:#cfc8dc;display:block;transition:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".012 .06" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="90"/></filter>
</svg>
<div id="stage">
  <div id="paper"></div>
  <div id="scenes"></div>
  <div id="dots"></div>
  <div id="wipe"></div>
  <div id="vig"></div>
</div>
<script>
/* ===================== CONFIG (edit here) ===================== */
const CHANNEL = "اسم قناتك";
const T_TITLE = 3.4, SC = 4.4, T_OUT = T_TITLE + 6*SC, T_END = T_OUT + 4.2;
const CITIES = [
 {name:"طنجـــة",   num:2500, note:"(منذ نحو القرن 5 ق.م)", side:"L", art:"tangier"},
 {name:"فـــاس",    num:1200, note:"(منذ 789م)",             side:"R", art:"fes"},
 {name:"مراكـــش",  num:950,  note:"(منذ 1070م)",            side:"L", art:"marrakech"},
 {name:"الربــاط",  num:850,  note:"(منذ نحو 1150م)",        side:"R", art:"rabat"},
 {name:"شفشـــاون", num:550,  note:"(منذ 1471م)",            side:"L", art:"chef"},
 {name:"أكاديـــر", num:520,  note:"(منذ 1505م)",            side:"R", art:"agadir"},
];
/* ============================================================== */
const $ = (s,r=document)=>r.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo3=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));

function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function jagged(seed,amp=7,step=34,w=100,h=100){ // torn-paper polygon in %
  const r=rnd(seed),p=[];const n=Math.round(w/ (step/6));
  for(let i=0;i<=n;i++)p.push([i/n*100,(r()*amp)]);
  for(let i=1;i<=n;i++)p.push([100-r()*amp,i/n*100]);
  for(let i=n-1;i>=0;i--)p.push([i/n*100,100-r()*amp]);
  for(let i=n-1;i>=1;i--)p.push([r()*amp,i/n*100]);
  return "polygon("+p.map(a=>a[0].toFixed(1)+"% "+a[1].toFixed(1)+"%").join(",")+")";
}
const flagSVG=`<svg viewBox="0 0 150 100" width="150" height="100"><rect width="150" height="100" fill="#c1272d"/>
<polygon points="75,22 82.6,45.4 107.2,45.4 87.3,59.9 94.9,83.3 75,68.8 55.1,83.3 62.7,59.9 42.8,45.4 67.4,45.4" fill="none" stroke="#006233" stroke-width="5" stroke-linejoin="miter"/></svg>`;
const cloudSVG=(w)=>`<svg viewBox="0 0 300 130" width="${w}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9b6bd"/></linearGradient></defs>
<g fill="url(#cg)"><circle cx="70" cy="80" r="42"/><circle cx="120" cy="55" r="50"/><circle cx="185" cy="62" r="46"/><circle cx="235" cy="88" r="36"/><rect x="40" y="82" width="230" height="40" rx="20"/></g></svg>`;
const blobSVG=(w,c)=>`<svg viewBox="0 0 300 300" width="${w}"><path d="M40 70 C90 10 200 20 250 70 C290 120 270 200 210 250 C150 290 70 270 30 210 C0 160 10 110 40 70Z" fill="${c}"/></svg>`;
const zellige=`<svg viewBox="0 0 300 300" width="300" height="300"><defs><pattern id="z" width="100" height="100" patternUnits="userSpaceOnUse">
<rect width="100" height="100" fill="#f6efe2"/><rect x="22" y="22" width="56" height="56" fill="#ee7a1d"/><rect x="22" y="22" width="56" height="56" fill="#3a1a6e" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="11" fill="#f6efe2"/><circle cx="0" cy="0" r="14" fill="#2f7f86"/><circle cx="100" cy="0" r="14" fill="#2f7f86"/><circle cx="0" cy="100" r="14" fill="#2f7f86"/><circle cx="100" cy="100" r="14" fill="#2f7f86"/></pattern></defs>
<rect width="300" height="300" fill="url(#z)"/></svg>`;

function tangierSVG(){
  const r=rnd(11);let h="";
  // hillside houses
  for(let row=0;row<9;row++){for(let i=0;i<14;i++){
    const x=40+i*38+(row%2)*18+r()*8, y=250+row*24-i*(6.5)+r()*6, w=30+r()*10, hh=24+r()*10;
    if(y<150||y>420)continue;
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#f4f1ea"/><rect x="${x+w-7}" y="${y}" width="7" height="${hh}" fill="#d9d2c4"/>`+
       `<rect x="${x+6}" y="${y+7}" width="7" height="10" fill="${r()>.6?'#4f86c6':'#3a1a6e'}"/>`;
  }}
  return `<svg viewBox="0 0 640 520" width="640" height="520">
  <defs><clipPath id="hill"><path d="M0 330 C80 250 160 190 270 160 C380 135 470 160 560 230 L640 260 L640 420 L0 420Z"/></clipPath></defs><path d="M0 330 C80 250 160 190 270 160 C380 135 470 160 560 230 L640 260 L640 420 L0 420Z" fill="#c9b79a"/>
  <g clip-path="url(#hill)">${h}</g>
  <!-- kasbah -->
  <rect x="330" y="120" width="170" height="150" fill="#efe7d6"/><rect x="330" y="120" width="170" height="14" fill="#d8cdb6"/>
  ${[0,1,2,3,4,5,6].map(i=>`<rect x="${332+i*24}" y="106" width="14" height="16" fill="#efe7d6"/>`).join("")}
  <path d="M385 270 v-70 a30 30 0 0 1 60 0 v70z" fill="#3a1a6e"/><path d="M395 270 v-66 a20 20 0 0 1 40 0 v66z" fill="#ee7a1d"/>
  <!-- minaret -->
  <rect x="215" y="90" width="58" height="190" fill="#efe7d6"/><rect x="215" y="120" width="58" height="34" fill="#2f7f86"/>
  <rect x="215" y="120" width="58" height="34" fill="url(#zz)"/>
  <rect x="204" y="78" width="80" height="14" fill="#d8cdb6"/><rect x="226" y="52" width="36" height="28" fill="#efe7d6"/>
  <circle cx="244" cy="42" r="9" fill="#e8b23a"/><rect x="242" y="48" width="4" height="10" fill="#e8b23a"/>
  <rect x="236" y="190" width="16" height="36" rx="8" fill="#3a1a6e"/>
  <!-- sea -->
  <path d="M0 400 C120 380 200 420 320 400 C440 380 520 420 640 396 V520 H0Z" fill="#1f6fb0"/>
  <path d="M0 440 C120 420 200 460 320 440 C440 420 520 460 640 436 V520 H0Z" fill="#4f9fd6"/>
  <path d="M0 482 C120 466 200 498 320 482 C440 466 520 498 640 480 V520 H0Z" fill="#9bcbe9"/>
  </svg>`;
}

/* ---------- scene builders ---------- */
function mk(html,css){const d=document.createElement("div");d.className="abs "+(css||"");d.innerHTML=html;return d}
function artFor(c,ax,s){ // returns {main,sec} elements (absolute inside scene), anchor ax = art centre x
  const E={};
  const img=(src,w,cls="")=>`<img src="${src}" width="${w}" class="${cls}" style="display:block">`;
  const scrap=(src,w,h,seed,cls="")=>{
    return `<div style="width:${w}px;height:${h}px;background:#fff;clip-path:${jagged(seed,5)};padding:12px"><div style="width:100%;height:100%;clip-path:${jagged(seed+9,4)};overflow:hidden"><img src="${src}" style="width:100%;height:100%;object-fit:cover;display:block" class="${cls}"></div></div>`;
  };
  switch(c.art){
   case "tangier": E.main=mk(tangierSVG(),"shadow"); E.mw=640;E.mh=520;E.my=250;E.mx=ax-320; break;
   case "fes":     E.main=mk(scrap("assets/fes_gate.jpg",660,456,3),"shadow"); E.mw=660;E.mh=456;E.my=260;E.mx=ax-330;
                   E.sec=mk(blobSVG(250,"#ee7a1d"),""); E.sx=ax+(s==="L"?-330:130); E.sy=220; break;
   case "marrakech":E.main=mk(img("assets/marr_minaret.png",430),"shadow"); E.mw=430;E.mh=645;E.my=150;E.mx=ax-215;
                   E.sec=mk(zellige,"shadow"); E.sx=ax+(s==="L"?120:-420); E.sy=470; E.srot=-6; break;
   case "rabat":   E.main=mk(img("assets/rabat_hassan_k.png",400),"shadow"); E.mw=400;E.mh=486;E.my=190;E.mx=ax-110;
                   E.sec=mk(img("assets/rabat_mausoleum.png",420),"shadow gray"); E.sx=ax-370; E.sy=430; break;
   case "chef":    E.main=mk(scrap("assets/chef.jpg",560,560,5),"shadow"); E.mw=560;E.mh=560;E.my=215;E.mx=ax-280;
                   E.sec=mk(blobSVG(240,"#ee7a1d"),""); E.sx=ax-330; E.sy=500; break;
   case "agadir":  E.main=mk(img("assets/agadir_vec.png",560),"shadow"); E.mw=560;E.mh=560;E.my=200;E.mx=ax-280;
                   E.sec=mk(img("assets/agadir_beach.png",470),"shadow gray"); E.sx=ax-380; E.sy=560; break;
  }
  return E;
}

const scenes=[];
CITIES.forEach((c,i)=>{
  const s=c.side, ax = s==="L"?560:1360, nx = s==="L"?1380:540; // art centre / number centre
  const root=document.createElement("div");root.className="scene";
  const g=mk("","");g.style.inset="0";root.appendChild(g);
  const circle=mk("","circle");circle.style.cssText+=`width:600px;height:600px;left:${ax+(s==="L"?40:-40)-300}px;top:150px`;
  const orange=mk(blobSVG(300,"#ee7a1d"),"");orange.style.cssText+=`left:${ax-320}px;top:420px`;
  const A=artFor(c,ax,s);
  [circle,orange].forEach(e=>g.appendChild(e));
  if(A.sec){A.sec.style.left=A.sx+"px";A.sec.style.top=A.sy+"px";if(A.srot)A.sec.style.transform=`rotate(${A.srot}deg)`;g.appendChild(A.sec)}
  A.main.style.left=A.mx+"px";A.main.style.top=A.my+"px";g.appendChild(A.main);
  const cl1=mk(cloudSVG(230),"");cl1.style.cssText+=`left:${ax-300}px;top:200px`;
  const cl2=mk(cloudSVG(150),"");cl2.style.cssText+=`left:${ax+190}px;top:290px`;
  g.appendChild(cl1);g.appendChild(cl2);
  const pole=mk("","");pole.style.cssText+=`left:${ax+30}px;top:84px;width:5px;height:300px;background:#2b2b34;border-radius:3px;transform-origin:top`;
  const flag=mk(flagSVG,"");flag.style.cssText+=`left:${ax+34}px;top:90px;transform-origin:left center`;
  g.appendChild(pole);g.appendChild(flag);
  const label=mk(`<div class="spiral"></div><span>${c.name}</span>`,"label");label.style.cssText+=`left:${ax-300}px;top:800px`;g.appendChild(label);
  const num=mk(`<div class="num">0</div>`,"");num.style.cssText+=`left:${nx-420}px;width:840px;top:300px;text-align:center`;
  const unit=mk(`ســـــنــــة`,"unit");unit.style.cssText+=`left:${nx-420}px;width:840px;top:545px;text-align:center`;
  const note=mk(c.note,"note");note.style.cssText+=`left:${nx-420}px;width:840px;top:650px;text-align:center`;
  g.appendChild(num);g.appendChild(unit);g.appendChild(note);
  $("#scenes").appendChild(root);
  scenes.push({c,root,g,circle,orange,sec:A.sec,main:A.main,cl1,cl2,pole,flag,label,num:$(".num",num),numBox:num,unit,note,s,ax});
});

/* title + outro */
const title=document.createElement("div");title.className="scene";
title.innerHTML=`
 <div class="abs brushbg" id="tbg" style="left:300px;top:300px;width:1320px;height:300px"></div>
 <div class="abs" id="ttxt" style="left:0;width:1920px;top:318px;text-align:center;font-weight:900;font-size:132px;color:#3a1a6e;white-space:nowrap">أقــدم المــدن المغربيــة</div>
 <div class="abs" id="tline" style="left:520px;top:560px;width:880px;height:26px;background:#ee7a1d;border-radius:14px;transform-origin:right"></div>
 <div class="abs" id="tsub" style="left:0;width:1920px;top:660px;text-align:center;font-weight:800;font-size:60px;color:#5b3a9a">رحلة عبر الزمن في ست مدن</div>
`;
$("#scenes").appendChild(title);
const outro=document.createElement("div");outro.className="scene";outro.style.background="#3a1a6e";
outro.innerHTML=`
 <div class="abs" id="oring" style="left:810px;top:230px;width:300px;height:300px;border-radius:50%;border:12px solid #ee7a1d;background:#5b3a9a;display:flex;align-items:center;justify-content:center;overflow:hidden">${flagSVG.replace('width="150" height="100"','width="330" height="220"')}</div>
 <div class="abs" id="othx" style="left:0;width:1920px;top:580px;text-align:center;font-weight:900;font-size:100px;color:#fff">شكرًا على المشاهدة</div>
 <div class="abs" id="opill" style="left:610px;top:760px;width:700px;height:110px;border:5px solid #ee7a1d;border-radius:60px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:56px;color:#fff">اشترك في ${CHANNEL}</div>
 <div class="abs" id="odots" style="left:0;width:1920px;top:120px;text-align:center;font-weight:800;font-size:46px;color:#ee7a1d">أقدم المدن المغربية</div>`;
$("#scenes").appendChild(outro);

/* progress dots */
CITIES.forEach(()=>{const d=document.createElement("i");$("#dots").appendChild(d)});
/* wipe strips */
const wipe=$("#wipe");
wipe.innerHTML=`<div id="w1" style="width:260px;background:#ee7a1d"></div><div id="w2" style="width:3000px;background:#3a1a6e"></div><div id="w3" style="width:200px;background:#7b5bc0"></div>`;

function show(el,v,d="block"){el.style.display=v?d:"none"}

function renderFrame(t){
  // --- title
  show(title,t<T_TITLE+0.25);
  if(t<T_TITLE+0.25){
    const a=eo3(seg(t,.2,.9)), b=eio(seg(t,.6,1.7)), l=eio(seg(t,1.4,2.2));
    $("#tbg").style.opacity=a; $("#tbg").style.transform=`scale(${.85+.15*a})`;
    $("#ttxt").style.clipPath=`inset(0 ${(1-b)*100}% 0 0)`;
    $("#tline").style.transform=`scaleX(${l})`;
    $("#tsub").style.opacity=eo3(seg(t,1.9,2.6)); $("#tsub").style.transform=`translateY(${(1-eo3(seg(t,1.9,2.6)))*30}px)`;
    
    $("#scenes").style.opacity=1;
  }
  // --- cities
  scenes.forEach((S,i)=>{
    const ls=t-(T_TITLE+i*SC);
    const vis=ls>-0.02&&ls<SC+0.02;
    show(S.root,vis); if(!vis)return;
    const e0=0.12;
    const k=(a,b)=>seg(ls,e0+a,e0+b);
    S.g.style.transform=`scale(${1+0.035*seg(ls,0,SC)})`;S.g.style.transformOrigin="50% 55%";
    S.circle.style.transform=`scale(${eob(k(0,.55))})`;
    S.orange.style.transform=`translateX(${(1-eo3(k(.1,.6)))*(S.s==="L"?-500:500)}px) rotate(${(1-eo3(k(.1,.6)))*-40}deg)`;
    S.main.style.opacity=eo3(k(.2,.4)); S.main.style.transform=`translateY(${(1-eo3(k(.2,.75)))*140}px) scale(${.92+.08*eo3(k(.2,.75))})`;
    if(S.sec){S.sec.style.opacity=eo3(k(.35,.55)); S.sec.style.transform=`translateY(${(1-eo3(k(.35,.9)))*100}px)`+(S.c.art==="marrakech"?" rotate(-6deg)":"")}
    S.cl1.style.opacity=eo3(k(.5,.8)); S.cl1.style.transform=`translateX(${Math.sin(ls*.9)*18-(1-eo3(k(.5,1)))*80}px)`;
    S.cl2.style.opacity=eo3(k(.6,.9)); S.cl2.style.transform=`translateX(${Math.cos(ls*.8)*14+(1-eo3(k(.6,1.1)))*80}px)`;
    const fp=eob(k(.55,1.0));
    S.pole.style.transform=`scaleY(${fp})`; S.flag.style.opacity=eo3(k(.7,.9));
    S.flag.style.transform=`translateY(${(1-fp)*40}px) skewY(${Math.sin(ls*7)*4}deg) scaleX(${1+Math.sin(ls*7+1)*.03})`;
    const lp=eo3(k(.7,1.2));
    S.label.style.opacity=lp; S.label.style.transform=`translateX(${(1-lp)*(S.s==="L"?-420:420)}px) rotate(${(1-lp)*-4+(-1.5)}deg)`;
    const np=eio(seg(ls,e0+1.0,e0+2.5));
    S.num.textContent=Math.round(S.c.num*np).toLocaleString("en-US");
    const nin=eo3(k(.9,1.2));
    S.numBox.style.opacity=nin; S.numBox.style.transform=`translateY(${(1-nin)*50}px) scale(${1+.05*Math.sin(np*Math.PI)})`;
    S.unit.style.opacity=eo3(seg(ls,e0+2.4,e0+2.8)); S.unit.style.transform=`translateY(${(1-eo3(seg(ls,e0+2.4,e0+2.8)))*30}px)`;
    S.note.style.opacity=eo3(seg(ls,e0+2.8,e0+3.2)); S.note.style.transform=`translateY(${(1-eo3(seg(ls,e0+2.8,e0+3.2)))*30}px)`;
  });
  // --- outro
  const lo=t-T_OUT; show(outro,lo>-0.02);
  if(lo>-0.02){
    $("#oring").style.transform=`scale(${eob(seg(lo,.2,.9))})`;
    $("#othx").style.opacity=eo3(seg(lo,.7,1.3));$("#othx").style.transform=`translateY(${(1-eo3(seg(lo,.7,1.3)))*40}px)`;
    $("#opill").style.opacity=eo3(seg(lo,1.2,1.8));$("#opill").style.transform=`scale(${.9+.1*eo3(seg(lo,1.2,1.8))})`;
    $("#odots").style.opacity=eo3(seg(lo,.1,.6));
  }
  // --- progress dots
  const ci=Math.floor((t-T_TITLE)/SC);
  show($("#dots"),t>T_TITLE+0.4&&t<T_OUT-0.2,"flex");
  [...$("#dots").children].forEach((d,i)=>{d.style.background=i===ci?"#ee7a1d":(i<ci?"#5b3a9a":"#cfc8dc")});
  // --- wipes at boundaries
  let wp=-1;
  for(let i=0;i<=6;i++){const tb=T_TITLE+i*SC;const p=(t-(tb-.45))/.9;if(p>=0&&p<=1){wp=p;break}}
  show(wipe,wp>=0);
  if(wp>=0){
    const e=eio(wp), L=2170-5420*e;
